<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Comunidade | RIVALS ARENA</title>
    <link rel="icon" href="images/logo-simbolo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="comunidade">
    <header id="site-header"></header>
    <main>
        <section>
            <div class="wrap">
                <h1>Comunidade</h1>
                <p class="muted">Publique, curta e comente. Tudo fica salvo só no seu navegador.</p>
                <form id="novo" class="panel" style="margin:20px 0"><label for="txt">Nova publicação</label><textarea
                        id="txt" rows="3"></textarea><button class="btn">Publicar</button></form><input id="busca"
                    placeholder="Pesquisar publicações" aria-label="Pesquisar publicações">
                <div id="feed"></div>
            </div>
        </section>
    </main>
    <footer id="site-footer"></footer>
    <script src="js/script.js"></script>
</body>

</html>
