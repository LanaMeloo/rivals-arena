<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Campeonatos | RIVALS ARENA</title>
    <link rel="icon" href="images/logo-simbolo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="campeonatos">
    <header id="site-header"></header>
    <main>
        <section>
            <div class="wrap">
                <h1>Campeonatos</h1>
                <p class="muted">Abertos, em andamento e encerrados. Dados de demonstração.</p>
                <div class="row" style="margin:20px 0"><input id="q" placeholder="Pesquisar campeonato"
                        aria-label="Pesquisar"><select id="jogo" aria-label="Modalidade">
                        <option value="">Todos os jogos</option>
                        <option>Battlezone</option>
                        <option>FIFA</option>
                    </select><select id="status" aria-label="Status">
                        <option value="">Todos os status</option>
                        <option value="aberto">Inscrições abertas</option>
                        <option value="andamento">Em andamento</option>
                        <option value="encerrado">Encerrados</option>
                    </select></div>
                <div class="grid" id="lista"></div>
            </div>
        </section>
    </main>
    <footer id="site-footer"></footer>
    <script src="js/script.js"></script>
</body>

</html>
